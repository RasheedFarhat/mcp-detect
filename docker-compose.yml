# MCP-DETECT Phase 1 lab. `docker compose up` (via `make lab-up`, which also
# handles cert generation and the Ollama model pull) is the only path anyone
# should need — no host Python/Node/uv, no manual telemetry delivery.
#
# Wazuh services below are a trimmed, self-contained copy of the official
# wazuh-docker single-node deployment (config vendored under wazuh/), so this
# repo does not depend on any sibling checkout.
#
# CREDENTIALS, STATED PLAINLY: the INDEXER_PASSWORD/API_PASSWORD defaults
# below (`SecretPassword` / `pYe/NaFfPWYuWIUxIWf0X5XdDigqQmcd`) are Wazuh's
# own published official single-node demo credentials, vendored here, not
# secrets this project invented or that protect anything sensitive in this
# lab. They are coupled to the bcrypt hash for the `admin` user vendored in
# `wazuh/config/wazuh_indexer/internal_users.yml` (also a stock Wazuh demo
# value) — changing the plaintext default here WITHOUT also regenerating
# that hash (`plugin/tools/hash.sh`, run inside the indexer image) will
# break authentication between wazuh.manager and wazuh.indexer. Override via
# a gitignored `.env` file (`WAZUH_INDEXER_PASSWORD=...`,
# `WAZUH_API_PASSWORD=...`) if you regenerate the hash to match; do not
# change one without the other. This is a single-node local dev lab, never
# intended for production or any deployment holding real secrets — see
# docs/STATE-OF-PROJECT.md's own "no operational deployment layer" note.
services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.0
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=${WAZUH_INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-SecretPassword}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=${WAZUH_API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-pYe/NaFfPWYuWIUxIWf0X5XdDigqQmcd}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # local_rules.xml is deliberately NOT bind-mounted here. wazuh_etc is a
      # named volume the manager's own 0-wazuh-init script seeds from a
      # baked-in backup on first boot, using "is /var/ossec/etc already
      # non-empty?" as its only signal that seeding already happened. A bind
      # mount targeting a path under /var/ossec/etc gets materialized by
      # Docker before that script runs, which makes the directory look
      # "already seeded" and silently skips the real seed (missing
      # etc/shared/, etc/decoders/, etc. -- analysisd then fails to start).
      # `make lab-up` installs the rule file with `docker compose cp` AFTER
      # the manager is confirmed up, exactly like Phase 0 did -- a one-time
      # config-install copy, not the continuous telemetry-delivery copy this
      # phase removes.
      # The one thing Phase 0 hand-fed with docker cp: now a native bind
      # target, tailed continuously by the manager's own localfile block.
      - mcp_telemetry:/var/log/mcp-detect

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.0
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=${WAZUH_INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-SecretPassword}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=${WAZUH_API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-pYe/NaFfPWYuWIUxIWf0X5XdDigqQmcd}
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer

  ollama:
    image: ollama/ollama:0.31.1
    hostname: ollama
    restart: always
    ports:
      - "11434:11434"
    environment:
      # Corpus generation is a long-running, bursty single-client workload.
      # Ollama's default keep_alive (5m) evicts the runner between calls
      # whenever the agent's think/tool-call time exceeds it, forcing a full
      # model reload (dropping KV/prompt cache) and racing incoming requests
      # against the reload -- an earlier source of mid-run 500s.
      #
      # KEEP_ALIVE=-1 (never evict) fixed that but traded it for a slower
      # failure: llama-server's on-disk prompt cache accumulates one entry
      # per distinct task prompt with nothing ever clearing it, so memory
      # climbs for the life of the runner (~2.2GiB -> ~2.9GiB over ~50min /
      # 40 sessions here) until it gets OOM-killed anyway. A finite
      # keep_alive forces a periodic reload, which drops that cache before
      # it can accumulate across a whole multi-hour run -- the reload cost
      # is small and bounded; unbounded cache growth isn't.
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_models:/root/.ollama

  agent:
    build:
      context: .
      dockerfile: lab/agent/Dockerfile
    hostname: agent
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TELEMETRY_LOG_PATH=/var/log/mcp-detect/telemetry.jsonl
      - MEMORY_FILE_PATH=/app/sandbox/memory.json
    volumes:
      - mcp_telemetry:/var/log/mcp-detect
      - agent_sandbox:/app/sandbox
      # Read-only real content for filesystem/git tasks to explore -- this
      # repo itself (docs, code, real git history), not synthetic fixtures.
      - .:/app/workspace:ro
    working_dir: /app
    command: ["sleep", "infinity"]

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  ollama_models:
  mcp_telemetry:
  agent_sandbox:
