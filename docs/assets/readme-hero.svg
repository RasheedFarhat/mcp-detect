  </g>

  <text x="1136" y="65" text-anchor="end" fill="#9ca0aa" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" letter-spacing="1">OPEN SOURCE / REPRODUCIBLE EVIDENCE</text>

  <g transform="translate(64 155)">
