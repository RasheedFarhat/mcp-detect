<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">MCP Detect</title>
  <desc id="desc">Watch the agent work. Catch the break in trust. Open-source MCP abuse-detection research grounded in recorded benign tool calls.</desc>

  <rect width="1200" height="500" fill="#08090a"/>

  <g stroke="#22252b" stroke-width="1">
    <path d="M0 104H1200M0 404H1200"/>
    <path d="M48 0V500M920 0V500M1152 0V500"/>
  </g>

  <g transform="translate(64 48)">
    <rect width="18" height="18" rx="4" fill="#ef4444"/>
    <text x="34" y="17" fill="#f4f4f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700" letter-spacing="2">MCP DETECT</text>
  </g>

  <text x="1136" y="65" text-anchor="end" fill="#9ca0aa" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" letter-spacing="1">OPEN-SOURCE MCP SECURITY RESEARCH</text>

  <g transform="translate(64 151)">
    <text x="0" y="76" fill="#f4f4f5" font-family="Avenir Next,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="650">Watch the agent work.</text>
    <text x="0" y="144" fill="#f4f4f5" font-family="Avenir Next,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="650">Catch the break in <tspan fill="#ef4444">trust.</tspan></text>
    <text x="0" y="192" fill="#9ca0aa" font-family="Avenir Next,Segoe UI,Helvetica,Arial,sans-serif" font-size="22">Detection research grounded in recorded benign tool calls.</text>
  </g>

  <g transform="translate(958 151)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <path d="M11 11V159" stroke="#464a53" stroke-width="2"/>
    <circle cx="11" cy="11" r="7" fill="#ef4444"/>
    <circle cx="11" cy="85" r="7" fill="#f4f4f5"/>
    <circle cx="11" cy="159" r="7" fill="#34d399"/>
    <text x="32" y="16" fill="#f4f4f5" font-size="16">IDENTITY</text>
    <text x="32" y="90" fill="#f4f4f5" font-size="16">HANDLER</text>
    <text x="32" y="164" fill="#f4f4f5" font-size="16">RESOURCE</text>
