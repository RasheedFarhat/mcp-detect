<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">MCP Detect</title>
  <desc id="desc">What it catches. What it misses. Reproducible open-source MCP abuse-detection research.</desc>

  <rect width="1200" height="500" fill="#08090a"/>

