  "description": "A content-exposing file-read tool (read_file/read_text_file) invoked with a clean ABSOLUTE path targeting a well-known sensitive system location (/etc/passwd|shadow|gshadow|sudoers, /etc/ssh/, /root/, ~/.ssh/{authorized_keys,known_hosts,config}, /proc/*/environ, /var/run/secrets/) -- accessing data beyond the tool's intended workspace scope. Grounded live against github.com/SAFE-MCP/safe-mcp techniques/SAF-T1104 (Over-Privileged Tool Abuse, tactic Execution ATK-TA0002; upstream's own example is 'Using a file-reading tool to access configuration files ... beyond the tool's intended scope'). ATT&CK T1068 (Exploitation for Privilege Escalation) cited from SAF-T1104's own MITRE ATT&CK Mapping list (T1059/T1068); T1068 over T1059 because no shell command executes here -- only a file tool's path argument. Data-access objective also aligns with T1005 (Data from Local System), the mapping SAF-T1105 uses, disclosed here the same way SAF-T1105 disclosed its own ATT&CK-fit reasoning. This detection CLOSES SAF-T1105's own disclosed known_gap E6 ('Absolute-path access without any ../ evades ... this rule matches the traversal MECHANISM, not arbitrary sensitive-path access') via a distinct mechanism: no '../' anywhere, so 100108 (traversal) misses it, and none of 100101's three named suffixes, so 100101 misses it -- exactly the D3 gap in docs/DISSECTION-FINDINGS.md, live-proven there. Authored end-to-end through the framework (attacks/abs_path_read_harness.py -> rule 100109 -> five gates), 0/4727 benign FP; see docs/ADD1-SAF-T1104-REPORT.md.",
