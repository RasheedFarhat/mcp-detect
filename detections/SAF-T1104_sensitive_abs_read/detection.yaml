  "known_gaps": [
    "Tool-name scope (positive): only read_file/read_text_file are matched, so a content-exposing read tool advertised under any other name evades -- the same bounded-tool-identity limitation SAF-T1502's exfil-hop negate-list (E5) and SAF-T1105's own negate-list already carry, disclosed not chased.",
    "Bounded sensitive-path list: only the named sensitive locations above are matched; other sensitive absolute paths (e.g. /etc/krb5.keytab, an application-specific secret file, a custom secrets mount) evade by construction -- the same bounded-named-list nature as SAF-T1502's six credential shapes, disclosed as a deliberate scope boundary, not an open-ended list chased to exhaustion.",
    "Encoded/obfuscated absolute paths (URL-encoded, Unicode-normalized) evade the literal path match -- same class as SAF-T1105's own encoding gaps (E2/E3/E4), not chased for the same reason.",
    "Out-of-root access with no traversal sequence AND no matched sensitive prefix (e.g. via a symlink whose textual path looks benign) leaves nothing for an argument-text rule to match -- structurally invisible, same class as SAF-T1105's symlink gap, unverified (no stateful filesystem fixture authored).",
    "Matches the tool-call ATTEMPT (the path argument), not the read's success -- deliberate, mirroring SAF-T1105's own outcome-independent IoC framing; a server that enforces its root boundary still surfaces the attempt, which is the detectable signal."
